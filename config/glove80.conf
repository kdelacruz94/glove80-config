# Pointing / mouse support.
# The Layout Editor expresses this as config_parameter HID_POINTING=y; the
# firmware symbol is ZMK_MOUSE (app/src/pointing/Kconfig in moergo-sc/zmk,
# where ZMK_POINTING defaults to y if ZMK_MOUSE). The V52 keymap needs it for
# the Mouse / Mouse_slow / Mouse_fast / Mouse_warp layers.
CONFIG_ZMK_MOUSE=y

# Central-only Raw HID / visualizer settings are in glove80_lh.conf.

# LOCAL BUILD-ONLY TRIAL (card g80-rgb-pr36-trial): per-key/per-layer RGB from
# darknao PR36. The board defconfig already sets ZMK_RGB_UNDERGLOW=y; restated
# here because check_rgb_build.py requires both. Brightness limits stay at the
# board defaults (max 80, min/step 4, start 16).
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_EXPERIMENTAL_RGB_LAYER=y
