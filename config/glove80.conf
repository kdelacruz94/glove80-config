# Pointing / mouse support.
# The Layout Editor expresses this as config_parameter HID_POINTING=y; the
# firmware symbol is ZMK_MOUSE (app/src/pointing/Kconfig in moergo-sc/zmk,
# where ZMK_POINTING defaults to y if ZMK_MOUSE). The V52 keymap needs it for
# the Mouse / Mouse_slow / Mouse_fast / Mouse_warp layers.
CONFIG_ZMK_MOUSE=y

# Raw HID transport + visualizer reporting, for MoergoLayerViz v2.x.
# Both lines are required: RAW_HID is the transport (also set by the
# raw_hid_adapter shield), HID_VIZ is the layer/key-event messaging on top.
CONFIG_RAW_HID=y
CONFIG_HID_VIZ=y

# Returned by the app's 0xFB config-ID query so it can auto-load the matching
# layout instead of asking. This is the uuid of the exported layout committed
# under layout/ -- if you export a NEW layout (new uuid), update this to match.
CONFIG_HID_VIZ_CONFIG_ID="15da8b74-bc9e-47fe-8334-34ea6d2318dc"
