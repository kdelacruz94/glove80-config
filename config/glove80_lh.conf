# Raw HID transport + visualizer reporting, for the central (left) half only.
# RAW_HID is the transport (also set by the raw_hid_adapter shield);
# HID_VIZ adds layer/key-event messaging. The peripheral cannot enable either.
CONFIG_RAW_HID=y
CONFIG_HID_VIZ=y

# Keep the full UUID from layout/*.json. The legacy 0xFB query truncates it
# to 31 bytes; the default-enabled 0xF9 manifest can carry it in chunks.
# MoergoLayerViz currently needs manual JSON selection; see README's Visualizer.
# If a NEW layout is exported (new uuid), update this value to match.
CONFIG_HID_VIZ_CONFIG_ID="15da8b74-bc9e-47fe-8334-34ea6d2318dc"
